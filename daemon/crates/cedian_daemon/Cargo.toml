[package]
name = "cedian_daemon"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[[bin]]
name = "cedian-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cedian_index = { path = "../cedian_index" }
cedian_protocol = { path = "../cedian_protocol" }
cedian_review = { path = "../cedian_review" }
cedian_agent = { path = "../cedian_agent" }
cedian_wire = { path = "../cedian_wire" }
chrono.workspace = true
futures.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
tungstenite = { version = "0.30.0", features = ["handshake"] }
