[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false
license-file = "LICENSE"

# Only MIT-compatible direct dependencies (docs/CEDIAN_SPEC.md §9). The GPUI/Zed
# crates from the pre-pivot architecture are gone; the daemon is plain Rust.
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16

# What ships (script/bundle-mac): thin LTO over one codegen unit for the smallest,
# fastest binary, and limited debug info, which on macOS goes to a dSYM beside the
# build and is stripped from what ships. "packed" has rustc run dsymutil at link
# time, while thin LTO's object files still exist; Cargo's macOS default leaves them
# unpacked, and they are gone by the time the bundle script could collect them.
[profile.release]
debug = "limited"
split-debuginfo = "packed"
lto = "thin"
codegen-units = 1
